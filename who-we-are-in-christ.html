var activeTab = 'all';
var LABELS = {who:'Who we are', have:'What we have', going:"Where we're going", ot:'OT Prophetic Root'};

function render() {
  var q = document.getElementById('q').value.toLowerCase();
  var filtered = DATA.filter(function(v) {
    var matchTab = activeTab === 'all' || v.cat === activeTab;
    var searchable = v.ref + ' ' + v.eng + ' ' + v.greek;
    if (v.fulfil) v.fulfil.forEach(function(f){ searchable += ' ' + f.ref + ' ' + f.text; });
    var matchQ = !q || searchable.toLowerCase().indexOf(q) > -1;
    return matchTab && matchQ;
  });
  document.getElementById('cnt').textContent = filtered.length + ' passage' + (filtered.length !== 1 ? 's' : '');
  var list = document.getElementById('list');
  if (!filtered.length) { list.innerHTML = '<div class="empty">No results found.</div>'; return; }
  list.innerHTML = filtered.map(function(v) {
    var langLabel = v.cat === 'ot' ? 'Hebrew · BHS' : 'Greek · NA28';
    var fulfilHTML = '';
    if (v.fulfil && v.fulfil.length) {
      fulfilHTML = '<div class="fulfil-block"><span class="fulfil-label">Fulfilled in Christ — New Testament</span>' +
        v.fulfil.map(function(f) {
          return '<div class="fulfil-item"><span class="fulfil-ref">' + f.ref + '</span><div class="fulfil-text">' + f.text + '</div></div>';
        }).join('') + '</div>';
    }
    return '<div class="verse-card ' + v.cat + '">' +
      '<div class="card-header"><span class="ref">' + v.ref + '</span><span class="badge ' + v.cat + '">' + LABELS[v.cat] + '</span></div>' +
      '<div class="eng">' + v.eng + '</div>' +
      '<div class="greek-block"><span class="greek-label">' + langLabel + '</span><div class="greek">' + v.greek + '</div></div>' +
      fulfilHTML + '</div>';
  }).join('');
}

document.getElementById('q').addEventListener('input', render);
document.querySelectorAll('.tab').forEach(function(btn) {
  btn.addEventListener('click', function() {
    activeTab = btn.getAttribute('data-tab');
    document.querySelectorAll('.tab').forEach(function(b) { b.className = 'tab'; });
    btn.className = 'tab active-' + activeTab;
    render();
  });
});
render();
</script>
